apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-ingress
  namespace: employee-system
spec:
  rules:
  - host: employee.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: employee-frontend
            port:
              number: 80
