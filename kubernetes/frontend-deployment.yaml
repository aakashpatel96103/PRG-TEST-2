apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-frontend
  namespace: employee-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-frontend
  template:
    metadata:
      labels:
        app: employee-frontend
    spec:
      containers:
      - name: frontend
        image: employee-frontend:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
